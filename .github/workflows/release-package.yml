name: Validate and Release Material Usage Auditor

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate package and archive
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package metadata and required files
        id: package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          for key in ("name", "version", "displayName", "unity"):
              if not package.get(key):
                  raise SystemExit(f"package.json is missing required field: {key}")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+", package["name"]):
              raise SystemExit("package.json name contains characters unsafe for an archive filename")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", package["version"]):
              raise SystemExit("package.json version must be a semantic version")
          required = (
              "Editor", "Editor.meta", "Tests", "Tests.meta", "package.json",
              "package.json.meta", "README.md", "README.md.meta", "CHANGELOG.md",
              "CHANGELOG.md.meta",
          )
          missing = [item for item in required if not Path(item).exists()]
          if missing:
              raise SystemExit("Required package files are missing: " + ", ".join(missing))
          print(f"Package metadata valid: {package['name']} {package['version']}")
          PY

          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          NAME=$(python3 -c "import json; print(json.load(open('package.json'))['name'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Create and inspect VPM package archive
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip" \
            Editor Editor.meta Tests Tests.meta package.json package.json.meta README.md README.md.meta CHANGELOG.md CHANGELOG.md.meta
          cp package.json dist/package.json
          zip -T "dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip"
          unzip -Z1 "dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip" > dist/archive-contents.txt
          python3 - <<'PY'
          from pathlib import Path

          entries = Path("dist/archive-contents.txt").read_text(encoding="utf-8").splitlines()
          required = ("package.json", "Editor/", "Tests/", "README.md", "CHANGELOG.md")
          for item in required:
              if not any(entry == item or entry.startswith(item) for entry in entries):
                  raise SystemExit(f"Package archive is missing {item}")
          if any(entry.startswith(".github/") for entry in entries):
              raise SystemExit("Package archive unexpectedly contains GitHub workflow files")
          PY

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: package-${{ needs.validate.outputs.package_name }}-${{ needs.validate.outputs.package_version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="v$PACKAGE_VERSION"
          fi
          gh release create "$TAG" "dist/$PACKAGE_NAME-$PACKAGE_VERSION.zip" \
            "dist/package.json" \
            --title "$PACKAGE_NAME $TAG" \
            --generate-notes
