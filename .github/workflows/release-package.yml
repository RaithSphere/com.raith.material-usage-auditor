name: Release Material Usage Auditor

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Unity package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          NAME=$(python3 -c "import json; print(json.load(open('package.json'))['name'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION. Update package.json or push the matching tag." >&2
            exit 1
          fi

      - name: Create VPM package archive
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip" \
            Editor Editor.meta Tests Tests.meta package.json package.json.meta README.md README.md.meta CHANGELOG.md CHANGELOG.md.meta
          cp package.json dist/package.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.package.outputs.version) }}"
          gh release create "$TAG" "dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip" \
            "dist/package.json" \
            --title "${{ steps.package.outputs.name }} $TAG" \
            --generate-notes
